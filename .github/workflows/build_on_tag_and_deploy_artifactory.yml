name: Build on Tag and Deploy Dev
on:
  push:
    tags: [ v* ]

jobs:
  build-deploy:
    name: Build on Tag and Deploy Dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Maven prepare
        uses: UbiqueInnovation/action-systems-mvn-prepare@bfeb86b8129a37da7d062487cc1dfb60718836cc # v2.0.0
        with:
          mvn_servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          mvn_repositories: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: Maven set versions
        uses: UbiqueInnovation/action-systems-mvn-versions-set@618ca57ac89fb34e35c0f8e6a02633aa33110280 # v1.1.1
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml

      - name: Maven install
        uses: UbiqueInnovation/action-systems-mvn-install@1e861d926529f75b9a2e02162965f813b944ee0f # v1.3.0
        with:
          parent_pom: pom.xml

      # Upload artifacts to artifactory

      - name: Upload JARs
        uses: UbiqueInnovation/action-systems-mvn-package-deploy@647b4e740f14c38ed79fbaa288126cf5465aff67 # v1.1.1
        with:
          parent_pom: pom.xml

      # Create a GitHub release

      - name: Create GitHub ${{ contains(github.ref_name, '-') == true && 'Prerelease' || 'Release' }}
        uses: UbiqueInnovation/action-systems-github-release@12b09f5c2d38a98ef89fcf0b41125c08ca5472d1 # v1.0.2
        with:
          ref_name: ${{ github.ref_name }}
          release_option_prerelease: ${{ contains(github.ref_name, '-') }}
          changelog_file: CHANGELOG.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
