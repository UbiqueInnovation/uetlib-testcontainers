name: Build on Tag and Deploy Dev
on:
  push:
    tags: [ v* ]

jobs:
  build-deploy:
    name: Build on Tag and Deploy Dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Maven prepare
        uses: UbiqueInnovation/action-systems-mvn-prepare@v1.0.1
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven set versions
        uses: UbiqueInnovation/action-systems-mvn-versions-set@v0.1.2
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml

      - name: Maven install
        uses: UbiqueInnovation/action-systems-mvn-install@v0.1.5
        with:
          parent_pom: pom.xml

      # Upload artifacts to artifactory

      - name: Upload JARs
        uses: UbiqueInnovation/action-systems-mvn-package-deploy@v1.0.0
        with:
          parent_pom: pom.xml
          alt_deployment_repository: ubique-artifactory::${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      # Create a GitHub release

      - name: Create GitHub ${{ contains(github.ref_name, '-') == true && 'Prerelease' || 'Release' }}
        uses: UbiqueInnovation/action-systems-github-release@v0.1.3
        with:
          ref_name: ${{ github.ref_name }}
          release_option_prerelease: ${{ contains(github.ref_name, '-') }}
          changelog_file: CHANGELOG.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
