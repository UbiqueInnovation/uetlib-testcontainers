name: Build on Tag and Deploy Dev
on:
  push:
    tags: [ v* ]

jobs:
  build-deploy:
    name: Build on Tag and Deploy Dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Maven prepare
        uses: UbiqueInnovation/action-systems-mvn-prepare@1f1440329f80458fcbf99214a888160840196d17 # v1.1.0
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven set versions
        uses: UbiqueInnovation/action-systems-mvn-versions-set@c2cefa132ced595a93cc3a2061e0032608dd1fb9 # v1.0.0
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml

      - name: Maven install
        uses: UbiqueInnovation/action-systems-mvn-install@aa3ba3077a3347317775acd000ec613018b9b903 # v1.0.1
        with:
          parent_pom: pom.xml

      # Upload artifacts to artifactory

      - name: Upload JARs
        uses: UbiqueInnovation/action-systems-mvn-package-deploy@0aebdb7d1dfae06ca3bf3e110b3bfb423ee7f71f # v1.0.0
        with:
          parent_pom: pom.xml
          alt_deployment_repository: ubique-artifactory::${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      # Create a GitHub release

      - name: Create GitHub ${{ contains(github.ref_name, '-') == true && 'Prerelease' || 'Release' }}
        uses: UbiqueInnovation/action-systems-github-release@a20d3197834d18f2f88c4f0726546bc038bdc788 # v1.0.0
        with:
          ref_name: ${{ github.ref_name }}
          release_option_prerelease: ${{ contains(github.ref_name, '-') }}
          changelog_file: CHANGELOG.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
