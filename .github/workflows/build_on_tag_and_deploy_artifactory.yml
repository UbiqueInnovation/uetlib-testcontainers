name: Build on Tag and Deploy Dev
on:
  push:
    tags: [ v* ]

jobs:
  build-deploy:
    name: Build on Tag and Deploy Dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref_name }}

      - name: Maven prepare
        uses: UbiqueInnovation/action-systems-mvn-prepare@1f1440329f80458fcbf99214a888160840196d17 # v1.1.0
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven set versions
        uses: UbiqueInnovation/action-systems-mvn-versions-set@618ca57ac89fb34e35c0f8e6a02633aa33110280 # v1.1.1
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml

      - name: Maven install
        uses: UbiqueInnovation/action-systems-mvn-install@4cb656bce2a93be50d8109150364d38b8954c4c7 # v1.1.3
        with:
          parent_pom: pom.xml

      # Upload artifacts to artifactory

      - name: Upload JARs
        uses: UbiqueInnovation/action-systems-mvn-package-deploy@647b4e740f14c38ed79fbaa288126cf5465aff67 # v1.1.1
        with:
          parent_pom: pom.xml
          alt_deployment_repository: ubique-artifactory::${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      # Create a GitHub release

      - name: Create GitHub ${{ contains(github.ref_name, '-') == true && 'Prerelease' || 'Release' }}
        uses: UbiqueInnovation/action-systems-github-release@5db68dd4a817a585f4a0a9aa7a2cbb8b32cc4433 # v1.0.1
        with:
          ref_name: ${{ github.ref_name }}
          release_option_prerelease: ${{ contains(github.ref_name, '-') }}
          changelog_file: CHANGELOG.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
