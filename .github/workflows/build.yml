name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build Project
    permissions:
      contents: read
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@ad1a60bc91bd02516b4dc61def5495e84e1d61a5 # v0.1.0
    with:
      sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.UBIQUE_SONAR_TOKEN }}

