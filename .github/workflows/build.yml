name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build Project
    permissions:
      contents: read
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@4ec4716424bf5b8252ea5480f680440c91233cc6 # v0.1.0
    with:
      sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.UBIQUE_SONAR_TOKEN }}

