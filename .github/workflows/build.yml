name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare maven
        uses: UbiqueInnovation/action-systems-mvn-prepare@1f1440329f80458fcbf99214a888160840196d17 # v1.1.0
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven Install
        uses: UbiqueInnovation/action-systems-mvn-install@aa3ba3077a3347317775acd000ec613018b9b903 # v1.0.1
        with:
          parent_pom: pom.xml
